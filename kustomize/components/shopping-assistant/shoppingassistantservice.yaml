apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingassistantservice
  labels:
    app: shoppingassistantservice
spec:
  selector:
    matchLabels:
      app: shoppingassistantservice
  template:
    metadata:
      labels:
        app: shoppingassistantservice
    spec:
      serviceAccountName: shoppingassistantservice
      terminationGracePeriodSeconds: 10
      volumes:
      - name: ollama-models
        emptyDir: {}
      containers:
      - name: server
        image: shoppingassistantservice:dev
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
        env:
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: productcatalogservice:3550
        - name: CART_SERVICE_ADDR
          value: cartservice:7070
        - name: OLLAMA_URL
          value: http://127.0.0.1:11434/api/generate
        - name: MODEL_NAME
          value: gemma3:1b
        - name: SHOPPING_ASSISTANT_USER_ID
          value: workshop-user
      - name: ollama
        image: ollama/ollama:0.12.3
        ports:
        - name: ollama
          containerPort: 11434
        env:
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434
        - name: OLLAMA_MODELS
          value: /models
        - name: OLLAMA_KEEP_ALIVE
          value: 24h
        - name: OLLAMA_NUM_PARALLEL
          value: "2"
        - name: OLLAMA_MODEL
          value: gemma3:1b
        command:
        - /bin/sh
        - -c
        args:
        - |
          ollama serve &
          pid=$!
          until ollama list >/dev/null 2>&1; do
            sleep 2
          done
          ollama pull "${OLLAMA_MODEL}"
          wait "$pid"
        volumeMounts:
        - name: ollama-models
          mountPath: /models
---
apiVersion: v1
kind: Service
metadata:
  name: shoppingassistantservice
  labels:
    app: shoppingassistantservice
spec:
  selector:
    app: shoppingassistantservice
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shoppingassistantservice
